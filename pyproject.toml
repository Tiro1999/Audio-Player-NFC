# Tool configuration only. The app is deployed as a bundle (deploy/bundle.py),
# not installed as a package; device dependencies live in requirements/.

[tool.nfc-player.build]
# Maturity of the next bundle: dev | experimental | release (rule 6).
maturity = "dev"
# Included modules; core and app are always part of a bundle (rule 1).
modules = ["nfc", "spotify", "wifi", "bluetooth", "update"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "deploy", "."]
addopts = "--import-mode=importlib -q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "deploy", "tests"]
extend-exclude = ["devTools", "tools", "setup"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "S"]
# S603/S607: subprocess with argv lists is intended (no shell).
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
